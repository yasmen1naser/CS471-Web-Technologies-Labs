<body>
     <h1>Number of Students in Each City</h1>

     {% for city in cities %}

          City: {{ city.city }} |
          Number of Students: {{ city.student_count }}
     </p>
     {% empty %}
     <p>No cities found.</p>
     {% endfor %}
