
<!DOCTYPE html>
<html>
<head>
     <title>Task 2 - Total Stock</title>
</head>
<body>
     <h1>Total Book Stock per Publisher</h1>

     <table border="1">
          <tr>
               <th>Publisher</th>
               <th>Location</th>
               <th>Total Stock</th>
          </tr>

          {% for publisher in publishers %}
          <tr>
               <td>{{ publisher.name }}</td>
               <td>{{ publisher.location }}</td>
               <td>{{ publisher.total_stock|default:0 }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="3">No publishers found.</td></tr>
          {% endfor %}
     </table>
</body>
</html>
