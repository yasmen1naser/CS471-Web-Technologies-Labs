
<!DOCTYPE html>
<html>
<head>
     <title>Task 6 - Filtered Books</title>
</head>
<body>
     <h1>Filtered Book Count per Publisher</h1>

     <p>Conditions: Price greater than 50, quantity less than 5 and greater than or equal to 1.</p>

     <table border="1">
          <tr>
               <th>Publisher</th>
               <th>Number of Books</th>
          </tr>

          {% for publisher in publishers %}
          <tr>
               <td>{{ publisher.name }}</td>
               <td>{{ publisher.book_count }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="2">No publishers found.</td></tr>
          {% endfor %}
     </table>
</body>
</html>
