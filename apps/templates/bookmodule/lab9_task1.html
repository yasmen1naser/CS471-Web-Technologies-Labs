
<!DOCTYPE html>
<html>
<head>
     <title>Task 1 - Book Availability</title>
</head>
<body>
     <h1>Book Availability Percentage</h1>

     <table border="1">
          <tr>
               <th>Book Title</th>
               <th>Quantity</th>
               <th>Availability Percentage</th>
          </tr>

          {% for book in books %}
          <tr>
               <td>{{ book.title }}</td>
               <td>{{ book.quantity }}</td>
               <td>{{ book.availability|floatformat:2 }}%</td>
          </tr>
          {% empty %}
          <tr><td colspan="3">No books found.</td></tr>
          {% endfor %}
     </table>
</body>
</html>
